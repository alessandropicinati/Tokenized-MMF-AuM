name: Update AuM data

on:
  schedule:
    # Every Monday at 06:00 UTC. Edit this cron to change the cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write          # allow the action to commit the refreshed data file

concurrency:
  group: update-aum
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest AuM data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aum_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly AuM update: $(date -u +%Y-%m-%d)"
            git push
          fi
